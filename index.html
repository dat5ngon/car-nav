<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Go Places</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
</head>
<body>
    <!-- Main App -->
    <div id="app">
        <!-- Top Search Bar -->
        <div id="search-bar" class="search-bar">
            <button id="menu-btn" class="icon-btn" title="Menu">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <div class="search-fields">
                <div class="search-input-wrap">
                    <span class="input-label from-label">From</span>
                    <input type="text" id="from-input" placeholder="Your location" autocomplete="off">
                    <button id="clear-from" class="icon-btn small" style="display:none;" title="Clear">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div class="search-input-wrap">
                    <span class="input-label to-label">To</span>
                    <input type="text" id="search-input" placeholder="Search destination..." autocomplete="off">
                    <button id="clear-search" class="icon-btn small" style="display:none;" title="Clear">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button id="swap-btn" class="icon-btn" title="Swap start and destination">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="7,3 7,21"/>
                    <polyline points="4,18 7,21 10,18"/>
                    <polyline points="17,21 17,3"/>
                    <polyline points="14,6 17,3 20,6"/>
                </svg>
            </button>
        </div>

        <!-- Suggestions panel (favourites + history) -- shown on input focus -->
        <div id="suggestions-panel" class="suggestions-panel" style="display:none;">
            <div class="suggestions-section" id="fav-section">
                <div class="suggestions-label">Favourites</div>
                <div id="fav-grid" class="fav-grid">
                    <!-- Filled by JS -->
                </div>
            </div>
            <div class="suggestions-section" id="history-section">
                <div class="suggestions-label">Recent</div>
                <div id="history-list" class="history-list">
                    <!-- Filled by JS -->
                </div>
            </div>
        </div>

        <!-- Search Results Dropdown -->
        <div id="search-results" class="search-results" style="display:none;"></div>

        <!-- Map Container -->
        <div id="map"></div>

        <!-- Route Info Panel -->
        <div id="route-panel" class="route-panel" style="display:none;">
            <div class="route-header">
                <div class="route-info">
                    <span id="route-duration" class="route-duration"></span>
                    <span id="route-distance" class="route-distance"></span>
                </div>
                <div class="route-dest" id="route-dest"></div>
            </div>
            <div class="route-actions">
                <button id="start-nav-btn" class="btn btn-nav">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
                    </svg>
                    Start
                </button>
                <button id="save-fav-btn" class="btn btn-secondary" title="Save to favourites">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
                        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                    </svg>
                </button>
                <button id="cancel-route-btn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>

        <!-- Navigation Panel (active navigation) -->
        <div id="nav-panel" class="nav-panel" style="display:none;">
            <div class="nav-instruction">
                <div id="nav-icon" class="nav-icon">
                    <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
                        <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
                    </svg>
                </div>
                <div class="nav-text">
                    <div id="nav-distance" class="nav-step-distance"></div>
                    <div id="nav-direction" class="nav-step-direction"></div>
                </div>
            </div>
            <div class="nav-footer">
                <div class="nav-eta">
                    <span id="nav-eta-time"></span>
                    <span id="nav-eta-remaining"></span>
                </div>
                <button id="stop-nav-btn" class="btn btn-danger">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12" rx="1"/>
                    </svg>
                    Stop
                </button>
            </div>
        </div>

        <!-- My Location FAB -->
        <button id="my-location-btn" class="fab fab-location" title="My location">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
            </svg>
        </button>

        <!-- Side Menu -->
        <div id="menu-overlay" class="menu-overlay" style="display:none;"></div>
        <div id="side-menu" class="side-menu">
            <div class="menu-header">
                <h2>Go Places</h2>
                <button id="close-menu-btn" class="icon-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="menu-items">
                <button class="menu-item" id="menu-avoid-tolls">
                    <span class="menu-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v1M12 16v1"/><path d="M9.5 15.5c0 0 .5 1 2.5 1s2.5-1.2 2.5-2.2c0-1.5-2-1.8-3-2.3s-2-1-2-2c0-1.2 1-2 2.5-2s2.5 1 2.5 1"/></svg></span>
                    <span>Avoid Tolls</span>
                    <span id="tolls-check" class="menu-check"></span>
                </button>
                <button class="menu-item" id="menu-avoid-highways">
                    <span class="menu-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L8 4"/><path d="M16 4l4 16"/><path d="M8 14h8"/><path d="M7 18h10"/><path d="M9 10h6"/></svg></span>
                    <span>Avoid Highways</span>
                    <span id="highways-check" class="menu-check"></span>
                </button>
                <button class="menu-item" id="menu-avoid-ferries">
                    <span class="menu-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20c2-1 4-1 6 0s4 1 6 0 4-1 6 0"/><path d="M4 17l1.5-8H10l-1 4h6l-1-4h4.5L20 17"/><path d="M12 5V3"/><circle cx="12" cy="7" r="2"/></svg></span>
                    <span>Avoid Ferries</span>
                    <span id="ferries-check" class="menu-check"></span>
                </button>
                <hr class="menu-divider">
                <button class="menu-item" id="menu-satellite">
                    <span class="menu-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><ellipse cx="12" cy="12" rx="4" ry="10"/></svg></span>
                    <span>Satellite View</span>
                    <span id="satellite-check" class="menu-check"></span>
                </button>
                <hr class="menu-divider">
                <button class="menu-item" id="menu-recent">
                    <span class="menu-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
                    <span>Recent Destinations</span>
                </button>
                <button class="menu-item" id="menu-favourites">
                    <span class="menu-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg></span>
                    <span>Edit Favourites</span>
                </button>
                <hr class="menu-divider">
                <button class="menu-item" id="menu-sync-backup">
                    <span class="menu-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><polyline points="12 13 12 8"/><polyline points="9.5 10.5 12 8 14.5 10.5"/></svg></span>
                    <span>Backup</span>
                </button>
                <button class="menu-item" id="menu-sync-restore">
                    <span class="menu-item-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><polyline points="12 12 12 17"/><polyline points="9.5 14.5 12 17 14.5 14.5"/></svg></span>
                    <span>Restore</span>
                </button>
            </div>
            <div class="menu-credit" style="padding:1rem 1.2rem;margin-top:auto;text-align:center;font-size:0.75rem;color:#888;">
                a <a href="https://dat5ngon.github.io" style="color:#888;text-decoration:underline;">dat5ngon</a>'s product
            </div>
        </div>

        <!-- Recent Destinations Modal -->
        <div id="recent-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Recent Destinations</h3>
                    <button id="close-recent-btn" class="icon-btn">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div id="recent-list" class="recent-list">
                    <p class="empty-state">No recent destinations</p>
                </div>
                <button id="clear-recent-btn" class="btn btn-secondary" style="margin-top:0.5rem;width:100%;">Clear All</button>
            </div>
        </div>

        <!-- Favourites Modal (edit/remove) -->
        <div id="fav-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Edit Favourites</h3>
                    <button id="close-fav-modal-btn" class="icon-btn">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div id="fav-edit-list" class="recent-list">
                    <p class="empty-state">No favourites yet</p>
                </div>
                <button id="import-gmap-btn" class="btn btn-secondary" style="margin-top:0.6rem;width:100%;gap:0.5rem;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Import from Google Maps
                </button>
            </div>
        </div>

        <!-- Import from Google Maps Dialog -->
        <div id="gmap-import-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Import from Google Maps</h3>
                    <button id="gmap-import-close-btn" class="icon-btn">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.8rem;">Paste a Google Maps link to import the place as a favourite.</p>
                <div style="margin-bottom:1rem;">
                    <input type="text" id="gmap-link-input" style="width:100%;padding:0.5rem 0.7rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:0.85rem;outline:none;" placeholder="https://maps.google.com/...">
                </div>
                <div style="display:flex;gap:0.6rem;justify-content:flex-end;">
                    <button id="gmap-import-cancel-btn" class="btn btn-secondary">Cancel</button>
                    <button id="gmap-import-ok-btn" class="btn btn-primary">Import</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div id="confirm-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="confirm-title">Confirm</h3>
                <button id="confirm-close-btn" class="icon-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <p id="confirm-message" style="color:var(--text-muted);font-size:0.9rem;line-height:1.5;margin-bottom:1rem;"></p>
            <div style="display:flex;gap:0.6rem;justify-content:flex-end;">
                <button id="confirm-cancel-btn" class="btn btn-secondary">Cancel</button>
                <button id="confirm-ok-btn" class="btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <!-- Add Favourite Dialog -->
    <div id="fav-add-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Save Favourite</h3>
                <button id="fav-add-close-btn" class="icon-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div style="margin-bottom:1rem;">
                <label style="font-size:0.8rem;color:var(--text-muted);display:block;margin-bottom:0.3rem;">Label</label>
                <input type="text" id="fav-label-input" style="width:100%;padding:0.5rem 0.7rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:0.9rem;outline:none;" placeholder="e.g. Home, Work...">
            </div>
            <div style="margin-bottom:1.2rem;">
                <label style="font-size:0.8rem;color:var(--text-muted);display:block;margin-bottom:0.5rem;">Icon</label>
                <div id="fav-icon-picker" class="fav-grid" style="gap:0.4rem;">
                    <button class="fav-icon-option" data-icon="⭐" title="Star">⭐</button>
                    <button class="fav-icon-option" data-icon="🏠" title="Home">🏠</button>
                    <button class="fav-icon-option" data-icon="🏢" title="Work">🏢</button>
                    <button class="fav-icon-option" data-icon="🏋️" title="Gym">🏋️</button>
                    <button class="fav-icon-option" data-icon="🏫" title="School">🏫</button>
                    <button class="fav-icon-option" data-icon="🏥" title="Hospital">🏥</button>
                    <button class="fav-icon-option" data-icon="🛒" title="Shopping">🛒</button>
                    <button class="fav-icon-option" data-icon="☕" title="Cafe">☕</button>
                </div>
            </div>
            <div style="display:flex;gap:0.6rem;justify-content:flex-end;">
                <button id="fav-add-cancel-btn" class="btn btn-secondary">Cancel</button>
                <button id="fav-add-save-btn" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- SafePlace iframe (hidden, for Google Drive sync) -->
    <iframe id="safePlaceFrame" src="https://dat5ngon.github.io/safe-place/" style="display:none"></iframe>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
    <script src="sync.js"></script>
    <script src="map.js"></script>
</body>
</html>
